# Builds and runs the app on an iOS Simulator and an Android emulator in the
# cloud, so nothing has to be installed locally. Each run uploads screenshots,
# a short screen recording, the app's logs, an optional release-build string
# check, and the installable builds. See AGENTS.md.
#
# Start by hand:  gh workflow run cloud-run.yml --ref dev \
#                   -f platforms=both -f dart_defines="SOME_FLAG=true"
# Fetch results:  gh run download <run-id> --dir results
name: Cloud run (iOS + Android)

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which devices to run
        type: choice
        options: [both, ios, android]
        default: both
      dart_defines:
        description: Space-separated KEY=VALUE pairs passed as --dart-define (for example SOME_FLAG=true)
        required: false
        default: ""
      wait_seconds:
        description: Seconds to wait after launch before the screenshot
        required: false
        default: "25"
      log_filter:
        description: Save the log lines containing this text to filtered-log.txt
        required: false
        default: ""
      release_forbidden:
        description: Space-separated strings that must not appear in the release build (empty skips the check)
        required: false
        default: ""

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_DEFINES: ${{ inputs.dart_defines }}
  WAIT_SECONDS: ${{ inputs.wait_seconds || '25' }}
  LOG_FILTER: ${{ inputs.log_filter }}
  RELEASE_FORBIDDEN: ${{ inputs.release_forbidden }}
  ANDROID_APP_ID: com.wolfdev.hojaty
  # Mecca, so prayer times and the qibla have a location.
  LAT: "21.4225"
  LON: "39.8262"
  # Optional: set this repo secret to push each build to Appetize for hands-on use.
  APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}

jobs:
  android:
    if: github.event_name == 'push' || inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: flutter --version && flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug $(sh ci/dart-defines.sh)

      - name: Run on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/android-run.sh

      - name: Release build string check
        if: always()
        run: |
          flutter build apk --release $(sh ci/dart-defines.sh)
          bash ci/release-check.sh android build/app/outputs/flutter-apk/app-release.apk

      - name: Collect builds
        if: always()
        run: |
          mkdir -p results/android
          cp build/app/outputs/flutter-apk/app-debug.apk results/android/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: results/android

      - name: Upload to Appetize (only when the APPETIZE_API_TOKEN secret is set)
        if: success() && env.APPETIZE_API_TOKEN != ''
        env:
          APPETIZE_KEY: ${{ vars.APPETIZE_ANDROID_KEY }}
        run: bash ci/appetize-upload.sh android results/android/app-debug.apk

  ios:
    if: github.event_name == 'push' || inputs.platforms != 'android'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version && xcodebuild -version && flutter pub get

      - name: Build for the iOS Simulator
        run: flutter build ios --simulator --debug $(sh ci/dart-defines.sh)

      - name: Run on the iOS Simulator
        run: bash ci/ios-run.sh

      - name: Release build string check
        if: always()
        run: |
          flutter build ios --release --no-codesign $(sh ci/dart-defines.sh)
          bash ci/release-check.sh ios build/ios/iphoneos/Runner.app

      - name: Collect builds
        if: always()
        run: |
          mkdir -p results/ios
          if [ -d build/ios/iphonesimulator/Runner.app ]; then
            (cd build/ios/iphonesimulator && zip -qry "$GITHUB_WORKSPACE/results/ios/Runner-simulator.zip" Runner.app)
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: results/ios

      - name: Upload to Appetize (only when the APPETIZE_API_TOKEN secret is set)
        if: success() && env.APPETIZE_API_TOKEN != ''
        env:
          APPETIZE_KEY: ${{ vars.APPETIZE_IOS_KEY }}
        run: bash ci/appetize-upload.sh ios results/ios/Runner-simulator.zip
